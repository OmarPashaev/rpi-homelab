global:
  checkNewVersion: false
  sendAnonymousUsage: false
api:
  dashboard: true
ping:
  entryPoint: "ping"
entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"
  ping:
    address: ":8082"
providers:
  docker:
    exposedByDefault: false
    endpoint: "tcp://docker-socket-proxy:2375"
  file:
    directory: /etc/traefik/dynamic
    watch: true
log:
  level: INFO
accessLog:
  format: json
  fields:
    defaultMode: keep
    headers:
      defaultMode: drop
      names:
        Authorization: drop
        Cookie: drop
        Set-Cookie: drop
